[workspace]
resolver = "3"
members = [
  "utils",
  "compile/calculator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

clap = { version = "4.6", features = ["cargo"] }
rustyline = { version = "18.0", features = ["derive"] }

utils = { path = "utils" }
